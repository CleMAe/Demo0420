services:
  api:
    build:
      context: ..
      dockerfile: hs/Dockerfile
    container_name: hs-portal-api
    volumes:
      - portal-data:/data
    environment:
      JWT_SECRET: ${JWT_SECRET:-portal-dev-secret-change-in-prod}
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    container_name: hs-portal-web
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./login.html:/usr/share/nginx/html/login.html:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./detail.html:/usr/share/nginx/html/detail.html:ro
      - ./portal-demos.js:/usr/share/nginx/html/portal-demos.js:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  portal-data: