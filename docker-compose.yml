services:
  api:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
        PIP_DEFAULT_TIMEOUT: ${PIP_DEFAULT_TIMEOUT:-120}
    container_name: portal-api
    volumes:
      - portal-data:/data
    environment:
      JWT_SECRET: ${JWT_SECRET:-portal-dev-secret-change-in-prod}
      PORTAL_BRAND_NAME: ${PORTAL_BRAND_NAME:-智能体Demo平台}
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: demo0420-web
    container_name: portal-web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  portal-data:
