<!DOCTYPE html>
<html lang="zh-CN" data-portal-page="copilot">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>代码 Copilot 企业版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['ui-sans-serif', 'system-ui', 'Segoe UI', 'Roboto', 'PingFang SC', 'Microsoft YaHei', 'sans-serif'] }
        }
      }
    };
  </script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
  <!-- 顶部导航 -->
  <header class="sticky top-0 z-30 border-b border-slate-200/80 bg-white/90 backdrop-blur-md">
    <div class="mx-auto flex max-w-7xl items-center justify-between px-4 py-4 sm:px-6">
      <div class="flex items-center gap-3">
        <a href="index.html" class="text-sm font-medium text-orange-600 hover:text-orange-700">← 返回工作台</a>
        <div class="h-6 w-px bg-slate-200"></div>
        <div>
          <p id="portal-brand-name" class="text-sm font-semibold text-slate-900">智能体Demo平台</p>
          <p class="text-xs text-slate-500">代码 Copilot 企业版 · IDE 内联补全与评审建议</p>
        </div>
      </div>
      <button id="btn-logout" type="button"
        class="rounded-xl border border-slate-200 bg-white px-4 py-2 text-sm font-medium text-slate-700 shadow-sm transition hover:border-slate-300 hover:bg-slate-50">
        退出
      </button>
    </div>
  </header>

  <div class="mx-auto flex max-w-7xl">
    <!-- 左侧功能菜单 -->
    <aside class="sticky top-[73px] z-20 hidden h-[calc(100vh-73px)] w-56 shrink-0 border-r border-slate-200/80 bg-white sm:flex sm:flex-col">
      <div class="flex flex-1 flex-col gap-1 overflow-y-auto p-4">
        <p class="mb-2 px-2 text-xs font-semibold uppercase tracking-wide text-slate-400">功能模块</p>
        <nav id="feature-nav" class="flex flex-col gap-0.5" aria-label="功能导航">
          <button type="button" data-feature="completion" class="w-full rounded-lg px-3 py-2 text-left text-sm font-medium transition bg-orange-500 text-white shadow-sm shadow-orange-500/25">
            代码补全
          </button>
          <button type="button" data-feature="review" class="w-full rounded-lg px-3 py-2 text-left text-sm font-medium transition bg-slate-100 text-slate-600 hover:bg-slate-200">
            代码审查
          </button>
          <button type="button" data-feature="refactor" class="w-full rounded-lg px-3 py-2 text-left text-sm font-medium transition bg-slate-100 text-slate-600 hover:bg-slate-200">
            重构建议
          </button>
          <button type="button" data-feature="standards" class="w-full rounded-lg px-3 py-2 text-left text-sm font-medium transition bg-slate-100 text-slate-600 hover:bg-slate-200">
            规范检查
          </button>
        </nav>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="min-w-0 flex-1 px-4 py-8 sm:px-6">
      <!-- 移动端功能切换 -->
      <div class="mb-6 sm:hidden">
        <p class="mb-2 text-xs font-semibold text-slate-400">功能模块（移动端）</p>
        <nav id="feature-nav-mobile" class="flex flex-wrap gap-2" aria-label="功能导航"></nav>
      </div>

      <!-- 功能面板容器 -->
      <div id="feature-panel"></div>
    </main>
  </div>

  <script>
    (function () {
      // 登录验证
      var token = localStorage.getItem('portal_token');
      if (!token) {
        window.location.href = 'login.html';
        return;
      }

      // 退出登录
      document.getElementById('btn-logout').addEventListener('click', function () {
        localStorage.removeItem('portal_token');
        localStorage.removeItem('portal_user');
        window.location.href = 'login.html';
      });

      // HTML 转义
      function escapeHtml(s) {
        if (!s) return '';
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      // 当前激活的功能
      var currentFeature = 'completion';

      // ==================== 代码补全功能 ====================
      var completionScenarios = [
        {
          lang: 'Python',
          title: '缓存读取函数',
          code: 'def fetch_user(uid: str) -> dict:\n    """从缓存读取用户"""\n    key = f"user:{uid}"\n    ',
          completion: 'return cache.get(key) or load_from_db(uid)',
          hint: 'AI 建议：优先从 Redis 缓存读取，未命中时回源数据库'
        },
        {
          lang: 'Java',
          title: 'Spring Boot Controller',
          code: '@RestController\n@RequestMapping("/api/users")\npublic class UserController {\n    @Autowired\n    private UserService userService;\n\n    @GetMapping("/{id}")\n    public ResponseEntity<User> getUser(@PathVariable Long id) {\n        ',
          completion: 'User user = userService.findById(id);\n        return user != null ? ResponseEntity.ok(user) : ResponseEntity.notFound().build();',
          hint: 'AI 建议：使用 Optional 包装返回值更符合 Java 8+ 最佳实践'
        },
        {
          lang: 'JavaScript',
          title: 'React Custom Hook',
          code: 'import { useState, useEffect } from \'react\';\n\nfunction useUserData(userId) {\n    const [user, setUser] = useState(null);\n    const [loading, setLoading] = useState(true);\n\n    useEffect(() => {\n        ',
          completion: 'fetch(`/api/users/${userId}`)\n            .then(res => res.json())\n            .then(setUser)\n            .finally(() => setLoading(false));\n    }, [userId]);\n\n    return { user, loading };',
          hint: 'AI 建议：添加错误状态处理和取消请求逻辑以避免内存泄漏'
        },
        {
          lang: 'Python',
          title: '异步数据库查询',
          code: 'async def get_orders(user_id: int, status: str = "active") -> list:\n    """获取用户订单列表"""\n    query = """\n        SELECT id, product_name, amount, created_at\n        FROM orders\n        WHERE user_id = $1 AND status = $2\n        ORDER BY created_at DESC\n        LIMIT 50\n    """\n    ',
          completion: 'return await database.fetch_all(query, user_id, status)',
          hint: 'AI 建议：考虑添加分页参数和索引优化建议'
        }
      ];

      var currentCompletionIndex = 0;

      function renderCompletion() {
        var scenario = completionScenarios[currentCompletionIndex];
        var panel = document.getElementById('feature-panel');
        
        panel.innerHTML = 
          '<div class="rounded-2xl border border-slate-200/80 bg-white p-6 shadow-sm">' +
          '<div class="mb-6 flex flex-wrap items-start justify-between gap-3">' +
          '<div>' +
          '<h2 class="text-xl font-semibold text-slate-900">多语言代码补全</h2>' +
          '<p class="mt-1 text-sm text-slate-500">基于上下文感知的智能代码补全，支持 Python / Java / JavaScript</p>' +
          '</div>' +
          '<span class="shrink-0 rounded-lg bg-orange-50 px-3 py-1 text-xs font-medium text-orange-700">模拟沙箱</span>' +
          '</div>' +
          
          '<div class="mb-4 flex flex-wrap items-center gap-3">' +
          '<label class="text-sm font-medium text-slate-600">编程语言：</label>' +
          '<select id="lang-select" class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-sm outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20">' +
          '<option value="0"' + (scenario.lang === 'Python' && currentCompletionIndex === 0 ? ' selected' : '') + '>Python - 缓存读取</option>' +
          '<option value="1"' + (scenario.lang === 'Java' ? ' selected' : '') + '>Java - Spring Controller</option>' +
          '<option value="2"' + (scenario.lang === 'JavaScript' ? ' selected' : '') + '>JavaScript - React Hook</option>' +
          '<option value="3"' + (currentCompletionIndex === 3 ? ' selected' : '') + '>Python - 异步查询</option>' +
          '</select>' +
          '</div>' +

          '<div class="rounded-xl border border-slate-200 bg-slate-900 p-4 font-mono text-sm text-slate-100">' +
          '<pre class="whitespace-pre-wrap leading-relaxed"><code id="code-display"></code><span id="ghost-text" class="text-slate-500"></span></pre>' +
          '</div>' +

          '<div class="mt-4 flex flex-wrap gap-3">' +
          '<button type="button" id="btn-complete" class="rounded-xl bg-orange-500 px-5 py-2.5 text-sm font-medium text-white shadow-sm shadow-orange-500/25 transition hover:bg-orange-600">' +
          '生成补全' +
          '</button>' +
          '<button type="button" id="btn-next-scenario" class="rounded-xl border border-slate-200 bg-white px-5 py-2.5 text-sm font-medium text-slate-700 transition hover:bg-slate-50">' +
          '下一个场景 →' +
          '</button>' +
          '</div>' +

          '<div id="completion-hint" class="mt-4 hidden rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800"></div>' +
          '</div>';

        // 显示代码
        document.getElementById('code-display').textContent = scenario.code;
        
        // 语言选择事件
        document.getElementById('lang-select').addEventListener('change', function(e) {
          currentCompletionIndex = parseInt(e.target.value);
          renderCompletion();
        });

        // 补全按钮事件
        document.getElementById('btn-complete').addEventListener('click', function() {
          var ghostEl = document.getElementById('ghost-text');
          var hintEl = document.getElementById('completion-hint');
          
          ghostEl.textContent = scenario.completion;
          ghostEl.className = 'text-emerald-400/90';
          
          hintEl.classList.remove('hidden');
          hintEl.innerHTML = '<span class="font-medium">💡 ' + escapeHtml(scenario.hint) + '</span>';
        });

        // 下一个场景按钮
        document.getElementById('btn-next-scenario').addEventListener('click', function() {
          currentCompletionIndex = (currentCompletionIndex + 1) % completionScenarios.length;
          renderCompletion();
        });
      }

      // ==================== 代码审查功能 ====================
      var reviewScenarios = [
        {
          title: 'SQL 注入漏洞检测',
          code: 'def get_user(username):\n    query = "SELECT * FROM users WHERE username = \'" + username + "\'"\n    cursor.execute(query)\n    return cursor.fetchone()',
          issues: [
            { level: '高危', type: '安全漏洞', desc: 'SQL 注入风险：直接拼接用户输入到 SQL 语句', fix: '使用参数化查询：cursor.execute("SELECT * FROM users WHERE username = %s", (username,))' },
            { level: '中危', type: '反模式', desc: '缺少异常处理：数据库操作未包裹 try-except', fix: '添加异常捕获并记录日志' },
            { level: '低危', type: '代码风格', desc: '函数缺少类型注解和文档字符串', fix: '添加 def get_user(username: str) -> Optional[dict]:' }
          ]
        },
        {
          title: '硬编码密钥检测',
          code: 'import requests\n\nAPI_KEY = "sk-1234567890abcdef"\nBASE_URL = "https://api.example.com"\n\ndef call_api(endpoint):\n    headers = {"Authorization": f"Bearer {API_KEY}"}\n    return requests.get(f"{BASE_URL}/{endpoint}", headers=headers)',
          issues: [
            { level: '高危', type: '安全漏洞', desc: '硬编码 API 密钥：敏感信息暴露在源代码中', fix: '使用环境变量：API_KEY = os.environ.get("API_KEY")' },
            { level: '中危', type: '安全漏洞', desc: '缺少请求超时设置：可能导致连接挂起', fix: '添加 timeout 参数：requests.get(..., timeout=10)' },
            { level: '低危', type: '最佳实践', desc: '未使用会话复用：每次请求创建新连接', fix: '使用 requests.Session() 管理连接池' }
          ]
        },
        {
          title: '资源泄漏检测',
          code: 'def read_config(file_path):\n    f = open(file_path, \'r\')\n    config = json.load(f)\n    return config\n\ndef process_data(data):\n    result = []\n    for item in data:\n        result.append(item * 2)\n    return result',
          issues: [
            { level: '高危', type: '资源泄漏', desc: '文件句柄未关闭：open() 后未调用 close() 或使用 with 语句', fix: '使用上下文管理器：with open(file_path, \'r\') as f:' },
            { level: '中危', type: '性能问题', desc: '列表追加效率低：循环中使用 append() 而非列表推导式', fix: '使用列表推导式：return [item * 2 for item in data]' },
            { level: '低危', type: '代码质量', desc: '缺少输入验证：未检查 file_path 是否存在', fix: '添加 Path(file_path).exists() 检查' }
          ]
        },
        {
          title: '并发安全问题',
          code: 'class Counter:\n    def __init__(self):\n        self.count = 0\n    \n    def increment(self):\n        self.count += 1\n    \n    def get_count(self):\n        return self.count',
          issues: [
            { level: '高危', type: '并发安全', desc: '竞态条件：多线程环境下 count += 1 非原子操作', fix: '使用 threading.Lock() 保护临界区' },
            { level: '中危', type: '设计缺陷', desc: '缺少线程同步机制：未使用原子变量或锁', fix: '引入 threading.Lock 或使用 concurrent.futures' },
            { level: '低危', type: '代码规范', desc: '类缺少文档字符串和方法类型注解', fix: '添加完整的 docstring 和类型提示' }
          ]
        }
      ];

      var currentReviewIndex = 0;

      function renderReview() {
        var scenario = reviewScenarios[currentReviewIndex];
        var panel = document.getElementById('feature-panel');
        
        var issuesHtml = scenario.issues.map(function(issue, idx) {
          var levelClass = issue.level === '高危' ? 'bg-red-50 text-red-700 border-red-200' : 
                          issue.level === '中危' ? 'bg-amber-50 text-amber-700 border-amber-200' : 
                          'bg-blue-50 text-blue-700 border-blue-200';
          
          return '<div class="rounded-xl border border-slate-200 bg-white p-4">' +
            '<div class="mb-2 flex items-center gap-2">' +
            '<span class="rounded-lg border px-2 py-0.5 text-xs font-medium ' + levelClass + '">' + escapeHtml(issue.level) + '</span>' +
            '<span class="text-xs font-medium text-slate-600">' + escapeHtml(issue.type) + '</span>' +
            '</div>' +
            '<p class="text-sm text-slate-700">' + escapeHtml(issue.desc) + '</p>' +
            '<div class="mt-2 rounded-lg bg-slate-50 p-3 text-xs leading-relaxed text-slate-600">' +
            '<span class="font-medium text-slate-700">修复建议：</span>' + escapeHtml(issue.fix) +
            '</div>' +
            '</div>';
        }).join('');

        panel.innerHTML = 
          '<div class="rounded-2xl border border-slate-200/80 bg-white p-6 shadow-sm">' +
          '<div class="mb-6 flex flex-wrap items-start justify-between gap-3">' +
          '<div>' +
          '<h2 class="text-xl font-semibold text-slate-900">代码审查模拟</h2>' +
          '<p class="mt-1 text-sm text-slate-500">自动检测安全漏洞、反模式和性能问题</p>' +
          '</div>' +
          '<span class="shrink-0 rounded-lg bg-orange-50 px-3 py-1 text-xs font-medium text-orange-700">模拟沙箱</span>' +
          '</div>' +
          
          '<div class="mb-4 flex items-center gap-3">' +
          '<label class="text-sm font-medium text-slate-600">审查场景：</label>' +
          '<select id="review-select" class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-sm outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20">' +
          reviewScenarios.map(function(s, i) {
            return '<option value="' + i + '"' + (i === currentReviewIndex ? ' selected' : '') + '>' + escapeHtml(s.title) + '</option>';
          }).join('') +
          '</select>' +
          '</div>' +

          '<div class="mb-4 rounded-xl border border-slate-200 bg-slate-900 p-4 font-mono text-xs text-slate-100">' +
          '<pre class="whitespace-pre-wrap leading-relaxed">' + escapeHtml(scenario.code) + '</pre>' +
          '</div>' +

          '<button type="button" id="btn-review" class="mb-4 rounded-xl bg-orange-500 px-5 py-2.5 text-sm font-medium text-white shadow-sm shadow-orange-500/25 transition hover:bg-orange-600">' +
          '运行代码审查' +
          '</button>' +

          '<div id="review-results" class="space-y-3"></div>' +

          '<div class="mt-4 flex justify-end">' +
          '<button type="button" id="btn-next-review" class="rounded-xl border border-slate-200 bg-white px-5 py-2.5 text-sm font-medium text-slate-700 transition hover:bg-slate-50">' +
          '下一个场景 →' +
          '</button>' +
          '</div>' +
          '</div>';

        // 场景选择事件
        document.getElementById('review-select').addEventListener('change', function(e) {
          currentReviewIndex = parseInt(e.target.value);
          renderReview();
        });

        // 审查按钮事件
        document.getElementById('btn-review').addEventListener('click', function() {
          document.getElementById('review-results').innerHTML = issuesHtml;
        });

        // 下一个场景按钮
        document.getElementById('btn-next-review').addEventListener('click', function() {
          currentReviewIndex = (currentReviewIndex + 1) % reviewScenarios.length;
          renderReview();
        });
      }

      // ==================== 重构建议功能 ====================
      var refactorScenarios = [
        {
          title: '提取方法重构',
          before: 'def process_order(order):\n    # 验证订单\n    if not order.get(\'items\'):\n        raise ValueError("订单为空")\n    if order.get(\'total\', 0) <= 0:\n        raise ValueError("金额无效")\n    \n    # 计算折扣\n    discount = 0\n    if order.get(\'vip\'):\n        discount = 0.1\n    elif order.get(\'total\', 0) > 1000:\n        discount = 0.05\n    \n    # 应用折扣\n    final_amount = order[\'total\'] * (1 - discount)\n    return final_amount',
          after: 'def validate_order(order):\n    if not order.get(\'items\'):\n        raise ValueError("订单为空")\n    if order.get(\'total\', 0) <= 0:\n        raise ValueError("金额无效")\n\ndef calculate_discount(order):\n    if order.get(\'vip\'):\n        return 0.1\n    elif order.get(\'total\', 0) > 1000:\n        return 0.05\n    return 0\n\ndef process_order(order):\n    validate_order(order)\n    discount = calculate_discount(order)\n    return order[\'total\'] * (1 - discount)',
          benefit: '可读性提升 40%，单一职责原则，便于单元测试'
        },
        {
          title: '简化条件表达式',
          before: 'def get_shipping_fee(weight, distance, is_express):\n    if is_express:\n        if weight <= 1:\n            if distance <= 100:\n                return 15\n            else:\n                return 25\n        else:\n            if distance <= 100:\n                return 20\n            else:\n                return 35\n    else:\n        if weight <= 1:\n            if distance <= 100:\n                return 8\n            else:\n                return 12\n        else:\n            if distance <= 100:\n                return 10\n            else:\n                return 18',
          after: 'def get_shipping_fee(weight, distance, is_express):\n    base_fee = 8 if weight <= 1 else 10\n    distance_surcharge = 4 if distance > 100 else 0\n    express_surcharge = 7 if is_express else 0\n    return base_fee + distance_surcharge + express_surcharge',
          benefit: '复杂度从 O(2³) 降至 O(1)，消除嵌套条件，易于维护'
        },
        {
          title: '优化循环性能',
          before: 'def find_duplicates(items):\n    duplicates = []\n    for i in range(len(items)):\n        for j in range(i + 1, len(items)):\n            if items[i] == items[j]:\n                if items[i] not in duplicates:\n                    duplicates.append(items[i])\n    return duplicates\n\ndef sum_even_numbers(numbers):\n    total = 0\n    for num in numbers:\n        if num % 2 == 0:\n            total += num\n    return total',
          after: 'def find_duplicates(items):\n    seen = set()\n    duplicates = set()\n    for item in items:\n        if item in seen:\n            duplicates.add(item)\n        seen.add(item)\n    return list(duplicates)\n\ndef sum_even_numbers(numbers):\n    return sum(num for num in numbers if num % 2 == 0)',
          benefit: '时间复杂度从 O(n²) 降至 O(n)，使用集合和生成器表达式提升性能'
        },
        {
          title: '使用设计模式',
          before: 'class NotificationService:\n    def send(self, msg_type, recipient, message):\n        if msg_type == \'email\':\n            # 发送邮件逻辑\n            print(f"发送邮件给 {recipient}: {message}")\n        elif msg_type == \'sms\':\n            # 发送短信逻辑\n            print(f"发送短信给 {recipient}: {message}")\n        elif msg_type == \'push\':\n            # 推送通知逻辑\n            print(f"发送推送给 {recipient}: {message}")',
          after: 'from abc import ABC, abstractmethod\n\nclass Notifier(ABC):\n    @abstractmethod\n    def send(self, recipient, message):\n        pass\n\nclass EmailNotifier(Notifier):\n    def send(self, recipient, message):\n        print(f"发送邮件给 {recipient}: {message}")\n\nclass SMSNotifier(Notifier):\n    def send(self, recipient, message):\n        print(f"发送短信给 {recipient}: {message}")\n\nclass PushNotifier(Notifier):\n    def send(self, recipient, message):\n        print(f"发送推送给 {recipient}: {message}")',
          benefit: '符合开闭原则，新增通知方式无需修改现有代码，便于扩展'
        }
      ];

      var currentRefactorIndex = 0;

      function renderRefactor() {
        var scenario = refactorScenarios[currentRefactorIndex];
        var panel = document.getElementById('feature-panel');
        
        panel.innerHTML = 
          '<div class="rounded-2xl border border-slate-200/80 bg-white p-6 shadow-sm">' +
          '<div class="mb-6 flex flex-wrap items-start justify-between gap-3">' +
          '<div>' +
          '<h2 class="text-xl font-semibold text-slate-900">重构建议生成</h2>' +
          '<p class="mt-1 text-sm text-slate-500">识别代码坏味道并生成重构方案</p>' +
          '</div>' +
          '<span class="shrink-0 rounded-lg bg-orange-50 px-3 py-1 text-xs font-medium text-orange-700">模拟沙箱</span>' +
          '</div>' +
          
          '<div class="mb-4 flex items-center gap-3">' +
          '<label class="text-sm font-medium text-slate-600">重构场景：</label>' +
          '<select id="refactor-select" class="rounded-lg border border-slate-200 bg-white px-3 py-1.5 text-sm outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20">' +
          refactorScenarios.map(function(s, i) {
            return '<option value="' + i + '"' + (i === currentRefactorIndex ? ' selected' : '') + '>' + escapeHtml(s.title) + '</option>';
          }).join('') +
          '</select>' +
          '</div>' +

          '<div class="grid gap-4 lg:grid-cols-2">' +
          '<div>' +
          '<p class="mb-2 text-sm font-medium text-slate-600">重构前</p>' +
          '<div class="rounded-xl border border-red-200 bg-red-50/50 p-4 font-mono text-xs text-slate-700">' +
          '<pre class="whitespace-pre-wrap leading-relaxed">' + escapeHtml(scenario.before) + '</pre>' +
          '</div>' +
          '</div>' +
          '<div>' +
          '<p class="mb-2 text-sm font-medium text-slate-600">重构后</p>' +
          '<div id="refactored-code" class="rounded-xl border border-emerald-200 bg-emerald-50/50 p-4 font-mono text-xs text-slate-700">' +
          '<pre class="whitespace-pre-wrap leading-relaxed">' + escapeHtml(scenario.after) + '</pre>' +
          '</div>' +
          '</div>' +
          '</div>' +

          '<div class="mt-4 rounded-lg border border-amber-200 bg-amber-50 px-4 py-3 text-sm text-amber-800">' +
          '<span class="font-medium">💡 重构收益：</span>' + escapeHtml(scenario.benefit) +
          '</div>' +

          '<div class="mt-4 flex justify-end">' +
          '<button type="button" id="btn-next-refactor" class="rounded-xl border border-slate-200 bg-white px-5 py-2.5 text-sm font-medium text-slate-700 transition hover:bg-slate-50">' +
          '下一个场景 →' +
          '</button>' +
          '</div>' +
          '</div>';

        // 场景选择事件
        document.getElementById('refactor-select').addEventListener('change', function(e) {
          currentRefactorIndex = parseInt(e.target.value);
          renderRefactor();
        });

        // 下一个场景按钮
        document.getElementById('btn-next-refactor').addEventListener('click', function() {
          currentRefactorIndex = (currentRefactorIndex + 1) % refactorScenarios.length;
          renderRefactor();
        });
      }

      // ==================== 规范检查功能 ====================
      var standardsData = {
        '命名规范': [
          { item: '变量名使用 snake_case（Python）或 camelCase（JS/Java）', status: true },
          { item: '常量使用 UPPER_SNAKE_CASE', status: true },
          { item: '类名使用 PascalCase', status: true },
          { item: '函数名清晰表达意图，避免缩写', status: false },
          { item: '布尔变量以 is_/has_/can_ 开头', status: true },
          { item: '避免单字母变量名（除循环计数器）', status: false }
        ],
        '注释规范': [
          { item: '公共 API 必须有文档字符串', status: true },
          { item: '复杂算法需添加实现思路注释', status: true },
          { item: '避免无意义的注释（如 i++ // i 加 1）', status: false },
          { item: 'TODO/FIXME 标注需附带责任人', status: false },
          { item: '注释与代码保持同步更新', status: true },
          { item: '使用中文注释说明业务逻辑', status: true }
        ],
        '安全规范': [
          { item: '禁止硬编码密钥和敏感信息', status: false },
          { item: '所有用户输入必须验证和转义', status: true },
          { item: '使用参数化查询防止 SQL 注入', status: true },
          { item: 'API 响应不包含堆栈跟踪', status: true },
          { item: '密码存储使用 bcrypt/scrypt 哈希', status: true },
          { item: '定期轮换 API 密钥和证书', status: false }
        ],
        '性能规范': [
          { item: '数据库查询添加索引和分页', status: true },
          { item: '避免 N+1 查询问题', status: false },
          { item: '使用连接池管理数据库连接', status: true },
          { item: '大对象使用流式处理', status: true },
          { item: '缓存热点数据减少重复计算', status: false },
          { item: '异步处理耗时操作', status: true }
        ]
      };

      var currentStandardsTab = '命名规范';

      function renderStandards() {
        var panel = document.getElementById('feature-panel');
        var items = standardsData[currentStandardsTab];
        var passedCount = items.filter(function(i) { return i.status; }).length;
        var complianceRate = Math.round((passedCount / items.length) * 100);
        
        var itemsHtml = items.map(function(item, idx) {
          return '<div class="flex items-start gap-3 rounded-lg border border-slate-200 bg-white p-3">' +
            '<input type="checkbox" ' + (item.status ? 'checked' : '') + ' disabled class="mt-0.5 h-4 w-4 accent-orange-500">' +
            '<div class="flex-1">' +
            '<p class="text-sm text-slate-700">' + escapeHtml(item.item) + '</p>' +
            '<p class="mt-1 text-xs ' + (item.status ? 'text-emerald-600' : 'text-red-600') + '">' + 
            (item.status ? '✓ 符合规范' : '✗ 需要整改') + '</p>' +
            '</div>' +
            '</div>';
        }).join('');

        panel.innerHTML = 
          '<div class="rounded-2xl border border-slate-200/80 bg-white p-6 shadow-sm">' +
          '<div class="mb-6 flex flex-wrap items-start justify-between gap-3">' +
          '<div>' +
          '<h2 class="text-xl font-semibold text-slate-900">企业规范检查清单</h2>' +
          '<p class="mt-1 text-sm text-slate-500">自动化代码规范检查与合规率评估</p>' +
          '</div>' +
          '<span class="shrink-0 rounded-lg bg-orange-50 px-3 py-1 text-xs font-medium text-orange-700">模拟沙箱</span>' +
          '</div>' +
          
          '<div class="mb-4 flex flex-wrap gap-2">' +
          Object.keys(standardsData).map(function(tab) {
            var activeClass = tab === currentStandardsTab ? 'bg-orange-500 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200';
            return '<button type="button" data-tab="' + tab + '" class="rounded-full px-4 py-1.5 text-sm font-medium transition ' + activeClass + '">' + escapeHtml(tab) + '</button>';
          }).join('') +
          '</div>' +

          '<div class="mb-4 rounded-xl border border-slate-200 bg-slate-50 p-4">' +
          '<div class="flex items-center justify-between">' +
          '<div>' +
          '<p class="text-sm font-medium text-slate-600">当前类别：' + escapeHtml(currentStandardsTab) + '</p>' +
          '<p class="mt-1 text-xs text-slate-500">通过 ' + passedCount + ' / ' + items.length + ' 项检查</p>' +
          '</div>' +
          '<div class="text-right">' +
          '<p class="text-2xl font-bold ' + (complianceRate >= 80 ? 'text-emerald-600' : complianceRate >= 60 ? 'text-amber-600' : 'text-red-600') + '">' + complianceRate + '%</p>' +
          '<p class="text-xs text-slate-500">合规率</p>' +
          '</div>' +
          '</div>' +
          '<div class="mt-3 h-2 overflow-hidden rounded-full bg-slate-200">' +
          '<div class="h-full rounded-full ' + (complianceRate >= 80 ? 'bg-emerald-500' : complianceRate >= 60 ? 'bg-amber-500' : 'bg-red-500') + '" style="width: ' + complianceRate + '%"></div>' +
          '</div>' +
          '</div>' +

          '<div class="space-y-2">' +
          itemsHtml +
          '</div>' +

          '<div class="mt-4 flex justify-end">' +
          '<button type="button" id="btn-generate-report" class="rounded-xl bg-orange-500 px-5 py-2.5 text-sm font-medium text-white shadow-sm shadow-orange-500/25 transition hover:bg-orange-600">' +
          '生成检查报告' +
          '</button>' +
          '</div>' +

          '<div id="report-output" class="mt-4 hidden rounded-xl border border-slate-200 bg-slate-50 p-4 text-sm text-slate-700"></div>' +
          '</div>';

        // Tab 切换事件
        panel.querySelectorAll('[data-tab]').forEach(function(btn) {
          btn.addEventListener('click', function() {
            currentStandardsTab = btn.getAttribute('data-tab');
            renderStandards();
          });
        });

        // 生成报告按钮
        document.getElementById('btn-generate-report').addEventListener('click', function() {
          var reportEl = document.getElementById('report-output');
          reportEl.classList.remove('hidden');
          
          var failedItems = items.filter(function(i) { return !i.status; });
          var reportHtml = 
            '<p class="font-medium text-slate-900 mb-2">📊 ' + escapeHtml(currentStandardsTab) + ' - 检查报告</p>' +
            '<p class="mb-2">合规率：<strong class="' + (complianceRate >= 80 ? 'text-emerald-600' : 'text-amber-600') + '">' + complianceRate + '%</strong></p>' +
            '<p class="mb-3">通过项：' + passedCount + ' | 待整改：' + failedItems.length + '</p>';
          
          if (failedItems.length > 0) {
            reportHtml += '<p class="font-medium text-red-700 mb-2">需要整改的项目：</p><ul class="list-disc space-y-1 pl-5">';
            failedItems.forEach(function(item) {
              reportHtml += '<li>' + escapeHtml(item.item) + '</li>';
            });
            reportHtml += '</ul>';
          } else {
            reportHtml += '<p class="text-emerald-700">✓ 所有检查项均符合规范！</p>';
          }
          
          reportEl.innerHTML = reportHtml;
        });
      }

      // ==================== 功能切换逻辑 ====================
      function renderFeatureNav() {
        var mobileNav = document.getElementById('feature-nav-mobile');
        var features = [
          { id: 'completion', label: '代码补全' },
          { id: 'review', label: '代码审查' },
          { id: 'refactor', label: '重构建议' },
          { id: 'standards', label: '规范检查' }
        ];
        
        mobileNav.innerHTML = features.map(function(f) {
          var active = f.id === currentFeature;
          var cls = active ? 'bg-orange-500 text-white shadow-sm shadow-orange-500/25' : 'bg-slate-100 text-slate-600 hover:bg-slate-200';
          return '<button type="button" data-feature="' + f.id + '" class="rounded-full px-3.5 py-1.5 text-xs font-medium transition ' + cls + '">' + escapeHtml(f.label) + '</button>';
        }).join('');

        mobileNav.querySelectorAll('[data-feature]').forEach(function(btn) {
          btn.addEventListener('click', function() {
            currentFeature = btn.getAttribute('data-feature');
            updateFeatureNav();
            renderFeaturePanel();
          });
        });
      }

      function updateFeatureNav() {
        // 更新桌面端导航
        document.querySelectorAll('#feature-nav button').forEach(function(btn) {
          var feature = btn.getAttribute('data-feature');
          if (feature === currentFeature) {
            btn.className = 'w-full rounded-lg px-3 py-2 text-left text-sm font-medium transition bg-orange-500 text-white shadow-sm shadow-orange-500/25';
          } else {
            btn.className = 'w-full rounded-lg px-3 py-2 text-left text-sm font-medium transition bg-slate-100 text-slate-600 hover:bg-slate-200';
          }
        });

        // 更新移动端导航
        renderFeatureNav();
      }

      function renderFeaturePanel() {
        switch(currentFeature) {
          case 'completion':
            renderCompletion();
            break;
          case 'review':
            renderReview();
            break;
          case 'refactor':
            renderRefactor();
            break;
          case 'standards':
            renderStandards();
            break;
        }
      }

      // 初始化桌面端导航事件
      document.querySelectorAll('#feature-nav button').forEach(function(btn) {
        btn.addEventListener('click', function() {
          currentFeature = btn.getAttribute('data-feature');
          updateFeatureNav();
          renderFeaturePanel();
        });
      });

      // 初始渲染
      renderFeatureNav();
      renderFeaturePanel();
    })();
  </script>
  <script src="portal-brand.js?v=20260526-docker-static"></script>
</body>
</html>
