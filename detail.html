<!DOCTYPE html>
<html lang="zh-CN" data-portal-page="detail">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>产品详情</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['ui-sans-serif', 'system-ui', 'Segoe UI', 'Roboto', 'PingFang SC', 'Microsoft YaHei', 'sans-serif'] }
        }
      }
    };
  </script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
  <header class="sticky top-0 z-10 border-b border-slate-200/80 bg-white/90 backdrop-blur-md">
    <div class="mx-auto flex max-w-3xl items-center justify-between gap-4 px-4 py-4 sm:px-6">
      <a href="index.html" class="text-sm font-medium text-orange-600 hover:text-orange-700">← 返回工作台</a>
      <button id="btn-logout" type="button"
        class="rounded-xl border border-slate-200 bg-white px-3 py-1.5 text-xs font-medium text-slate-700 shadow-sm transition hover:bg-slate-50">
        退出
      </button>
    </div>
  </header>

  <main class="mx-auto max-w-3xl px-4 py-10 sm:px-6">
    <p id="load-err" class="hidden rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"></p>
    <div id="content" class="hidden rounded-2xl border border-slate-200/80 bg-white p-8 shadow-sm">
      <div id="badges" class="mb-4 flex flex-wrap gap-2"></div>
      <h1 id="title" class="text-2xl font-semibold tracking-tight text-slate-900"></h1>
      <p id="subtitle" class="mt-3 text-sm leading-relaxed text-slate-600"></p>
      <div id="detail-body" class="prose prose-slate mt-8 max-w-none space-y-4 text-sm leading-relaxed text-slate-600"></div>
      <div id="demo-sandbox-mount"></div>
      <div class="mt-10 flex flex-wrap gap-3">
        <a id="open-external" href="#" target="_blank" rel="noopener noreferrer"
          class="inline-flex items-center rounded-xl bg-orange-500 px-5 py-2.5 text-sm font-medium text-white shadow-sm shadow-orange-500/25 transition hover:bg-orange-600">
          打开产品链接
        </a>
        <a href="index.html" class="inline-flex items-center rounded-xl border border-slate-200 bg-white px-5 py-2.5 text-sm font-medium text-slate-700 transition hover:bg-slate-50">
          返回列表
        </a>
      </div>
    </div>
  </main>

  <script src="portal-demos.js?v=20260526-docker-static"></script>
  <script>
    (function () {
      var token = localStorage.getItem('portal_token');
      if (!token) {
        window.location.href = 'login.html';
        return;
      }

      document.getElementById('btn-logout').addEventListener('click', function () {
        localStorage.removeItem('portal_token');
        localStorage.removeItem('portal_user');
        window.location.href = 'login.html';
      });

      function apiBase() {
        if (!window.location.host) {
          return 'http://127.0.0.1';
        }
        return '';
      }

      function escapeHtml(s) {
        if (!s) return '';
        return String(s)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      var params = new URLSearchParams(window.location.search);
      var id = params.get('id');
      var loadErr = document.getElementById('load-err');
      var content = document.getElementById('content');

      if (!id) {
        loadErr.textContent = '缺少产品 id';
        loadErr.classList.remove('hidden');
        return;
      }

      fetch(apiBase() + '/api/products/' + encodeURIComponent(id), {
        headers: { 'Authorization': 'Bearer ' + token }
      })
        .then(function (res) {
          if (res.status === 401) {
            localStorage.removeItem('portal_token');
            localStorage.removeItem('portal_user');
            window.location.href = 'login.html';
            return Promise.reject(new Error('unauthorized'));
          }
          return res.json().then(function (data) {
            if (!res.ok) throw new Error((data && data.detail) || '加载失败');
            return data;
          });
        })
        .then(function (p) {
          document.getElementById('title').textContent = p.name;
          document.getElementById('subtitle').textContent = p.description;
          var badges = document.getElementById('badges');
          var parts = [
            '<span class="inline-flex rounded-lg bg-amber-50 px-2.5 py-1 text-xs font-medium text-amber-900">' + escapeHtml(p.tech_stack || '') + '</span>',
            '<span class="inline-flex rounded-lg bg-slate-100 px-2.5 py-1 text-xs font-medium text-slate-700">' + escapeHtml(p.industry) + '</span>'
          ];
          if (p.badge) {
            parts.push('<span class="inline-flex rounded-lg bg-orange-50 px-2.5 py-1 text-xs font-medium text-orange-700">' + escapeHtml(p.badge) + '</span>');
          }
          badges.innerHTML = parts.join('');
          var body = document.getElementById('detail-body');
          var paras = (p.detail_intro || '').split(/\n\n+/).map(function (x) { return x.trim(); }).filter(Boolean);
          if (!paras.length) {
            paras = [p.description];
          }
          body.innerHTML = paras.map(function (t) {
            return '<p>' + escapeHtml(t).replace(/\n/g, '<br/>') + '</p>';
          }).join('');
          var link = document.getElementById('open-external');
          var externalUrl = (p.url && String(p.url).trim()) || '';
          if (externalUrl) {
            link.href = externalUrl;
            link.classList.remove('hidden');
          } else {
            link.removeAttribute('href');
            link.classList.add('hidden');
          }
          var demoRoot = document.getElementById('demo-sandbox-mount');
          if (demoRoot) {
            if (window.PortalDemos && typeof window.PortalDemos.mount === 'function') {
              window.PortalDemos.mount(demoRoot, p);
            } else {
              demoRoot.innerHTML = '<div class="mt-10 rounded-2xl border border-red-200 bg-red-50 p-5 text-sm text-red-700">交互演示脚本未加载，请确认通过 Docker 服务地址打开页面并刷新重试。</div>';
            }
          }
          content.classList.remove('hidden');
        })
        .catch(function (ex) {
          if (ex.message === 'unauthorized') return;
          loadErr.textContent = ex.message || '加载失败';
          loadErr.classList.remove('hidden');
        });
    })();
  </script>
  <script src="portal-brand.js?v=20260526-docker-static"></script>
</body>
</html>
