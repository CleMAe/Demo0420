<!DOCTYPE html>
<html lang="zh-CN" data-portal-page="login">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['ui-sans-serif', 'system-ui', 'Segoe UI', 'Roboto', 'PingFang SC', 'Microsoft YaHei', 'sans-serif'] }
        }
      }
    };
  </script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased flex items-center justify-center p-6">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="inline-flex h-12 w-12 items-center justify-center rounded-2xl bg-orange-500 text-white text-[11px] font-bold shadow-sm shadow-orange-500/25">Demo</div>
      <h1 id="portal-brand-name" class="mt-4 text-2xl font-semibold tracking-tight text-slate-900">智能体Demo平台</h1>
      <p class="mt-2 text-sm text-slate-500">使用分配账号登录以访问工作台</p>
    </div>

    <div class="rounded-2xl border border-slate-200/80 bg-white p-8 shadow-sm shadow-slate-200/50">
      <form id="login-form" class="space-y-5">
        <div>
          <label for="username" class="block text-sm font-medium text-slate-700 mb-1.5">用户名</label>
          <input id="username" name="username" type="text" autocomplete="username" required
            class="w-full rounded-xl border border-slate-200 bg-slate-50/50 px-4 py-2.5 text-sm outline-none ring-orange-500/20 transition focus:border-orange-500 focus:bg-white focus:ring-4" />
        </div>
        <div>
          <label for="password" class="block text-sm font-medium text-slate-700 mb-1.5">密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required
            class="w-full rounded-xl border border-slate-200 bg-slate-50/50 px-4 py-2.5 text-sm outline-none ring-orange-500/20 transition focus:border-orange-500 focus:bg-white focus:ring-4" />
        </div>
        <p id="error-msg" class="hidden text-sm text-red-600"></p>
        <button type="submit"
          class="w-full rounded-xl bg-orange-500 px-4 py-2.5 text-sm font-medium text-white shadow-sm shadow-orange-500/25 transition hover:bg-orange-600 focus:outline-none focus:ring-4 focus:ring-orange-500/30">
          登录
        </button>
      </form>
    </div>
  </div>

  <script>
    (function () {
      var form = document.getElementById('login-form');
      var err = document.getElementById('error-msg');

      function apiBase() {
        // 必须通过 http://本机（默认 80 端口）访问；若误用 file:// 打开本地 HTML，相对路径请求会失败
        if (!window.location.host) {
          return 'http://127.0.0.1';
        }
        return '';
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        err.classList.add('hidden');
        var username = document.getElementById('username').value.trim();
        var password = document.getElementById('password').value;

        fetch(apiBase() + '/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: username, password: password })
        })
          .then(function (res) {
            return res.text().then(function (text) {
              var data = null;
              try {
                data = text ? JSON.parse(text) : null;
              } catch (e) {
                throw new Error(res.ok ? '响应格式异常' : ('服务错误 (' + res.status + ')'));
              }
              if (!res.ok) {
                var msg = '登录失败';
                if (data && data.detail != null) {
                  if (typeof data.detail === 'string') msg = data.detail;
                  else if (Array.isArray(data.detail) && data.detail[0] && data.detail[0].msg) {
                    msg = data.detail.map(function (x) { return x.msg; }).join('；');
                  }
                }
                throw new Error(msg);
              }
              return data;
            });
          })
          .then(function (data) {
            if (!data || !data.token) {
              throw new Error('登录响应缺少 Token');
            }
            localStorage.setItem('portal_token', data.token);
            localStorage.setItem('portal_user', JSON.stringify(data.user));
            window.location.href = 'index.html';
          })
          .catch(function (ex) {
            err.textContent = ex.message || '网络错误';
            err.classList.remove('hidden');
          });
      });
    })();
  </script>
  <script src="portal-brand.js?v=20260526-docker-static"></script>
</body>
</html>
