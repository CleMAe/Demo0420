<!DOCTYPE html>
<html lang="zh-CN" data-portal-page="smart-office">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>智能办公智能体</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['ui-sans-serif', 'system-ui', 'Segoe UI', 'Roboto', 'PingFang SC', 'Microsoft YaHei', 'sans-serif'] }
        }
      }
    };
  </script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
  <header class="sticky top-0 z-10 border-b border-slate-200/80 bg-white/90 backdrop-blur-md">
    <div class="mx-auto flex max-w-5xl items-center justify-between gap-4 px-4 py-4 sm:px-6">
      <div class="min-w-0">
        <a href="index.html" class="text-sm font-medium text-orange-600 hover:text-orange-700">← 返回工作台</a>
        <h1 class="mt-1 text-lg font-semibold tracking-tight text-slate-900">智能办公智能体</h1>
        <p class="text-xs text-slate-500">多流程文档审查 · DeepSeek 大模型</p>
      </div>
      <button id="btn-logout" type="button"
        class="shrink-0 rounded-xl border border-slate-200 bg-white px-3 py-1.5 text-xs font-medium text-slate-700 shadow-sm transition hover:bg-slate-50">
        退出
      </button>
    </div>
  </header>

  <main class="mx-auto max-w-5xl px-4 py-8 sm:px-6 sm:py-10">
    <p id="load-err" class="hidden rounded-xl border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"></p>

    <section id="config-panel" class="mb-6 rounded-2xl border border-slate-200/80 bg-white p-5 shadow-sm sm:p-6">
      <div class="flex flex-wrap items-start justify-between gap-3">
        <div>
          <h2 class="text-sm font-semibold text-slate-900">大模型 API Key 配置</h2>
          <p class="mt-1 text-xs leading-relaxed text-slate-500">
            Key 保存在服务端环境变量 <code class="rounded bg-slate-100 px-1">DEEPSEEK_API_KEY</code>，不会写入浏览器。
            Docker 部署时在项目根目录 <code class="rounded bg-slate-100 px-1">.env</code> 中配置后重启 <code class="rounded bg-slate-100 px-1">api</code> 服务。
          </p>
        </div>
        <span id="key-status" class="rounded-lg bg-slate-100 px-2.5 py-1 text-xs font-medium text-slate-600">检测中…</span>
      </div>
      <dl class="mt-4 grid gap-2 text-xs text-slate-600 sm:grid-cols-2">
        <div><dt class="inline font-medium text-slate-700">模型：</dt><dd id="cfg-model" class="inline">—</dd></div>
        <div><dt class="inline font-medium text-slate-700">接口：</dt><dd id="cfg-base" class="inline break-all">—</dd></div>
      </dl>
      <p id="cfg-hint" class="mt-3 text-xs leading-relaxed text-slate-500"></p>
      <pre class="mt-3 overflow-x-auto rounded-xl border border-slate-200 bg-slate-50 p-3 text-[11px] leading-relaxed text-slate-700">DEEPSEEK_API_KEY=sk-your-key
DEEPSEEK_BASE_URL=https://api.deepseek.com
DEEPSEEK_MODEL=deepseek-v4-flash</pre>
    </section>

    <section class="rounded-2xl border border-slate-200/80 bg-white p-5 shadow-sm sm:p-6">
      <div id="scenario-tabs" class="flex flex-wrap gap-2 border-b border-slate-100 pb-4"></div>
      <label class="mt-4 block text-xs font-medium text-slate-600">待审查内容</label>
      <textarea id="review-content" rows="8"
        class="mt-1 w-full resize-none rounded-xl border border-slate-200 bg-slate-50/50 px-4 py-3 text-sm leading-relaxed outline-none ring-orange-500/20 transition focus:border-orange-500 focus:bg-white focus:ring-4"></textarea>
      <button id="btn-review" type="button"
        class="mt-4 inline-flex items-center gap-2 rounded-xl bg-orange-500 px-5 py-2.5 text-sm font-medium text-white shadow-sm shadow-orange-500/25 transition hover:bg-orange-600 disabled:cursor-not-allowed disabled:bg-orange-300">
        开始审查（DeepSeek）
      </button>
      <div id="review-result" class="mt-4 hidden rounded-xl border border-slate-200 bg-slate-50/80 p-4 text-sm text-slate-700"></div>
    </section>
  </main>

  <script src="smart-office.js"></script>
  <script src="portal-brand.js"></script>
</body>
</html>
